name: Update OpenABF formula

on:
  repository_dispatch:
    types: [openabf-released]

jobs:
  update_formula:
    name: Bump openabf.rb to ${{ github.event.client_payload.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute new tarball SHA256
        id: sha
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          URL="https://github.com/educelab/OpenABF/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Update formula url and sha256
        run: |
          URL="${{ steps.sha.outputs.url }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i \
            -e "s|url \".*\"|url \"${URL}\"|" \
            -e "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" \
            Formula/openabf.rb

      - name: Remove stale bottle block
        run: |
          # Remove the bottle do...end block if present (bottles must be rebuilt for new versions)
          ruby -i -e '
            in_bottle = false
            indent = ""
            ARGF.each_line do |line|
              if line =~ /^(\s*)bottle do/
                in_bottle = true
                indent = $1
              end
              print line unless in_bottle
              in_bottle = false if in_bottle && line =~ /^#{indent}end/
            end
          ' Formula/openabf.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "update/openabf-${{ steps.sha.outputs.version }}"
          commit-message: "openabf: update to ${{ steps.sha.outputs.tag }}"
          title: "openabf ${{ steps.sha.outputs.version }}"
          body: |
            Automated update of `Formula/openabf.rb` to OpenABF ${{ steps.sha.outputs.tag }}.

            Triggered by release: https://github.com/educelab/OpenABF/releases/tag/${{ steps.sha.outputs.tag }}

            > [!NOTE]
            > Bottle hashes have been removed and must be rebuilt before merging.
          labels: "dependencies,automated"
          draft: true
