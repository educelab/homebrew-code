name: Auto-label bumper PRs for pr-pull

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Add pr-pull label to passing bumper PRs
        uses: actions/github-script@v9
        with:
          # GITHUB_TOKEN-applied labels do NOT trigger downstream
          # workflows (GitHub's recursion guard). Use a PAT so the
          # `labeled` event reaches publish.yml.
          github-token: ${{ secrets.BUMP_PR_PAT }}
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No same-repo PR linked to this run; skipping.");
              return;
            }
            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ref.number,
              });
              if (pr.state !== 'open') {
                core.info(`#${pr.number} not open; skipping.`);
                continue;
              }
              if (!/^bump-/.test(pr.head.ref)) {
                core.info(`#${pr.number} head ${pr.head.ref} is not a bumper branch; skipping.`);
                continue;
              }
              if (pr.labels.some(l => l.name === 'pr-pull')) {
                core.info(`#${pr.number} already labeled pr-pull.`);
                continue;
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['pr-pull'],
              });
              core.info(`Labeled #${pr.number} with pr-pull.`);
            }
